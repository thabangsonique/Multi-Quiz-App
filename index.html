<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Outfit:wght@100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <title>Multi-Topic Quiz</title>
  </head>
  <body>
    <main class="app-container">
      <h1>Multi-Topic Quiz</h1>
      <!-- HOME SCREEN -(topics) -->
      <section id="home-screen">
        <div class="heading-container">
          <h2>Quiz Topics</h2>
          <p>Select a topic to begin.</p>
        </div>

        <!-- render the topics with DOM -->
        <div id="topics-container"></div>
      </section>

      <!-- QUIZ SCREEN -->
      <section id="quiz" class="hidden">
        <div class="quiz-heading">
          <h2 id="quiz-topic">Science</h2>
          <h3 id="question-number">Question 1 of 10</h3>
          <p id="score">Score: 1 out of 10</p>

          <!--quiz progress bar -->
          <div id="progress"></div>
        </div>

        <!-- answer options -->
        <div class="answers-container">
          <h2 id="question"></h2>
          <div id="answer-options"></div>
        </div>

        <!-- next button -->
        <button id="next-btn">Next Question</button>
      </section>

      <!-- RESULTS SCREEN -->
      <section id="results-screen" class="hidden">
        <h2>Quiz Complete!</h2>
        <!-- final score display -->
        <p id="final-score">You got a final score of 10 / 10!</p>

        <div id="results-summary"></div>

        <button>Choose Another Topic</button>
      </section>
    </main>

    <script src="data.js"></script>

    <script src="script.js"></script>
  </body>
</html>
